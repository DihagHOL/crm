name: Prüfung

# Läuft bei jedem Push und Pull Request. Verhindert, dass ein Syntaxfehler
# oder eine kaputte Kernlogik auf GitHub Pages landet – die Seite wird ohne
# Build-Schritt ausgeliefert.
#
# Seit dem 17.11.2026 veröffentlicht derselbe Lauf, und zwar nur nach grüner
# Prüfung und nur für main. Hochgeladen werden allein die Seiten, assets/,
# css/, js/ und aus docs/ nur, was die App zur Laufzeit lädt (die Anleitung
# 10-prozess.md und die Prozessmodelle). Bis dahin lieferte Pages das ganze
# Repository aus, und cache-bust.yml schrieb nach jedem Push einen Bot-Commit
# mit ?v=<SHA> zurück. Jetzt setzt der Lauf ?v= nur in seiner eigenen Kopie.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ausdruecklich nur lesen. Veröffentlichen darf nur der Job weiter unten.
# Wichtig bei `pull_request`: ein fremder Beitrag soll mit nichts mehr
# arbeiten als dem Lesen des Codes.
permissions:
  contents: read

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax aller JavaScript-Dateien
        run: |
          fehler=0
          for f in js/*.js tests/*.mjs; do
            if node --check "$f"; then
              echo "  ok   $f"
            else
              echo "  FEHLER $f"; fehler=1
            fi
          done
          exit $fehler

      - name: Einlesen der Arbeitsmappe (Kopfzeilen, Zeilennummern)
        run: node tests/test-excel.mjs

      - name: Umwandlungen (deutsche Zahlen, Datum, leer/null/Null)
        run: node tests/test-transforms.mjs

      - name: Aufbau der Nutzlast (Schlüssel, Schreibregeln, Lookups)
        run: node tests/test-mapping.mjs

      - name: Auflösungsphase (Sammelabfragen, Filterfeld, Rückfallweg)
        run: node tests/test-aufloesung.mjs

      - name: Batch-Format (Aufbau und Auswertung)
        run: node tests/test-batch.mjs

      - name: Prüflauf (Einstufung neu/geändert/unverändert/übersprungen)
        run: node tests/test-pruefung.mjs

      - name: Importlauf (neu angelegte Elterndatensätze, Ausschluss)
        run: node tests/test-lauf.mjs

      - name: Dublettenprüfung der Schlüsselfelder
        run: node tests/test-dubletten.mjs

      - name: Belegung im Ziel (Verweise als _feld_value)
        run: node tests/test-belegung.mjs

      - name: Prozessbeschreibung im Reiter „Anleitung"
        run: node tests/test-doku.mjs

      - name: Automatik (Takt, Tor zum Import, kopfloses Laden der Module)
        run: node tests/test-automatik.mjs

      - name: Protokoll (ausgelassene Zeilen, Vollprotokoll zurücklesen)
        run: node tests/test-protokoll.mjs

      - name: Prozessmodelle gegen das Hausschema des RMS (R1-R10)
        run: node tests/test-prozess.mjs

      - name: Konfiguration, Ladereihenfolge und Doku auf Konsistenz prüfen
        run: node tests/test-konsistenz.mjs

      - name: Verdrahtung der Seite (Schrift, Versionsparameter, Veröffentlichung)
        run: node tests/test-seite.mjs

  veroeffentlichen:
    needs: pruefung
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nur dieser Job darf veröffentlichen, und nur das.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read   # nur zum Nachsehen, ob das Paket schon gelistet ist (Schritt „Warten …“)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    # Zwei Pushes kurz nacheinander: nacheinander veröffentlichen, keinen Lauf abbrechen.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, auf den Commit festgelegt

      # Ohne das lädt ein Browser nach einer Änderung weiter die alte app.js
      # (Pages liefert mit max-age=600). Früher als Bot-Commit, jetzt nur in der Kopie.
      - name: "Versionsparameter ?v=… auf den Commit setzen"
        run: |
          SHA="${GITHUB_SHA::8}"
          sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$SHA/g" index.html prozess.html

      # Nur was die Seite braucht. Von docs/ nur, was die App zur Laufzeit lädt.
      - name: Dateien der Seite zusammenstellen
        run: |
          mkdir -p _site/docs
          cp -r index.html prozess.html CNAME assets css js _site/
          cp -r docs/bpmn _site/docs/
          cp -r docs/10-prozess.md _site/docs/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site

      # GitHub listet das hochgeladene Paket manchmal erst Sekunden später. deploy-pages fragt
      # sofort danach und bricht dann mit „No artifacts named github-pages“ ab (in der
      # Bedarfsanfrage am 25.11.2026 dreimal, das Paket war jeweils eine Sekunde später da).
      # Darum erst warten, bis es da ist.
      - name: Warten, bis das Paket gelistet ist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${n:-0}" -ge 1 ]; then echo "Paket gelistet (Versuch $i)"; sleep 3; exit 0; fi
            sleep 2
          done
          echo "::warning::Paket nach 60 Sekunden noch nicht gelistet, Veröffentlichen wird trotzdem versucht"

      - name: Veröffentlichen
        id: deployment
        continue-on-error: true   # zweiter Versuch weiter unten
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

      # deploy-pages sieht das Paket manchmal auch nach dem Warten noch nicht (25.11.2026 in
      # e-rechnung). Dann nach einer halben Minute ein zweiter Versuch. Scheitert auch der, ist der Lauf rot.
      - name: Vor dem zweiten Versuch warten
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Veröffentlichen, zweiter Versuch
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
