name: Automatischer Import

# Sieht nach, ob neue Mappen im Quellordner liegen, prueft sie und
# importiert die unstrittigen. Ob ein Lauf wirklich etwas tut, entscheidet
# NICHT dieser Zeitplan, sondern die Liste CRM_Automatik in SharePoint:
# dort stehen Schalter, Takt, Zeitfenster und Wochentage. Eine Taktaenderung
# ist damit eine Eingabe im Werkzeug und kein Pull Request.
#
# ZEITPLAN: so dicht wie moeglich, weil GitHub nur einen Bruchteil liefert.
#
# Am 05.11.2026 an den echten Laeufen dieses Workflows gemessen, die beiden
# Zeitplaene im direkten Vergleich:
#
#   "*/15 * * * *"           23.09.-22.10.   5,4 Laeufe/Tag von 96 erbetenen
#                                            Luecke Median 4,3 h, hoechstens  9,4 h
#   "17 1,4,7,...,22 * * *"  22.10.-05.11.   3,8 Laeufe/Tag von  8 erbetenen
#                                            Luecke Median 6,3 h, hoechstens 12,7 h
#
# Das sparsame Raster vom 22.10. war ein Fehlschluss. Die Annahme war,
# GitHub liefere einen sparsamen Plan zuverlaessiger ab - und fuer die
# ZUSTELLUNG stimmt das auch, das Nachbarprojekt ZAPP zeigt es: ein
# taeglicher Cron lief an 20 von 20 Tagen, nur im Median 5h48 zu spaet.
# Fuer die LUECKE stimmt es nicht. GitHub verwirft eine faellige Ausloesung,
# es sammelt sie nicht nach: wer oefter bittet, bekommt oefter etwas. Acht
# Bitten am Tag ergaben weniger Laeufe und groessere Luecken als 96.
# Deshalb zurueck auf den dichten Takt.
#
# Was damit NICHT zu haben ist: Puenktlichkeit. Am 05.11.2026 lag
# "Anfragen 2026-11-05.xlsx" um 06:00 im Ordner, der letzte Lauf war um
# 03:30, und bis 11:00 loeste nichts mehr aus - fuenf Stunden unbeachtet,
# ohne dass etwas defekt war. Wer den Import binnen Minuten nach der Ablage
# will, braucht einen Anstoss von aussen (unten, und docs/11). Mit GitHubs
# Zeitplan ist das nicht zu haben, auch nicht durch eine geschicktere
# Cron-Zeile.
#
# Der dichte Cron fragt nur nach. Gearbeitet wird nur, wenn CRM_Automatik
# es zulaesst, und der Takt dort (30 min) bleibt die Bremse.

on:
  schedule:
    - cron: "*/15 * * * *"

  # Anstoss von aussen, fuer den Fall, dass der Import binnen Minuten nach
  # der Ablage laufen soll. Heute ruft das niemand; die Zeile steht hier,
  # damit es spaeter keine Codeaenderung braucht, sondern nur einen Sender
  # (docs/11). Alle Eingaben unten sind auf workflow_dispatch eingegrenzt,
  # ein per repository_dispatch angestossener Lauf verhaelt sich deshalb
  # wie ein planmaessiger: Takt, Zeitfenster und Schalter entscheidet
  # weiter CRM_Automatik.
  #
  # Welchen Weg ein Sender nimmt, ist eine RECHTEFRAGE, nicht Geschmack.
  # repository_dispatch verlangt von einem feingranularen Token "Contents:
  # write" - also genau das Recht, mit dem man auch Code nach main schieben
  # und damit die veroeffentlichte Seite aendern kann. workflow_dispatch
  # verlangt "Actions: write": Laeufe starten und abbrechen, kein Schreiben
  # im Repository. Ein Token, das in einem Power-Automate-Flow liegt, soll
  # das engere der beiden haben. Deshalb ist in docs/11 workflow_dispatch
  # der empfohlene Weg, und diese Zeile hier bleibt nur der offene Zweitweg.
  repository_dispatch:
    types: [mappe-eingegangen]
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Takt und Zeitfenster uebergehen"
        type: boolean
        default: true
      trocken:
        description: "Nur pruefen und berichten, nichts schreiben"
        type: boolean
        default: false
      stichtag:
        description: "Stichtag nur fuer DIESEN Lauf (JJJJ-MM-TT), z. B. um eine aeltere Mappe zu pruefen"
        type: string
        default: ""
      umgebung:
        description: "Zielumgebung nur fuer DIESEN Lauf"
        type: choice
        options: ["wie in js/config.js", "TEST", "PROD"]
        default: "wie in js/config.js"

# Solange die Secrets fehlen, steigt das Skript sauber aus (Exit 0) statt zu
# scheitern: ein roter Lauf viermal je Stunde waere eine Fehlermail fuer
# etwas, das niemand kaputt gemacht hat. Was fehlt, steht im Protokoll.

# Ausdruecklich nur lesen. Die Organisation stellt den GITHUB_TOKEN heute
# ohnehin auf read, aber dieser Lauf hat das Client-Secret im Speicher: dann
# soll nicht eine geaenderte Vorgabe an anderer Stelle entscheiden, was er
# darf. Geschrieben wird hier nichts ins Repository.
permissions:
  contents: read

# Zwei Laeufe gleichzeitig wuerden dieselbe Datei zweimal importieren.
concurrency:
  group: crm-automatik
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci` und nicht `npm install`: nur so entscheidet das Lockfile,
      # welche Bytes kommen. `install` darf aufloesen und still etwas
      # anderes holen - bei einer Abhaengigkeit, die eine fremde Datei
      # parst, ist das die falsche Freiheit. `ci` bricht ausserdem ab, wenn
      # package.json und Lock auseinanderlaufen.
      - name: SheetJS installieren
        run: npm ci --prefix cron --no-audit --no-fund
      - name: Import-Lauf
        working-directory: cron
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CRM_ERZWINGEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.erzwingen) && '1' || '0' }}
          CRM_TROCKEN:   ${{ (github.event_name == 'workflow_dispatch' && inputs.trocken) && '1' || '0' }}
          # Nur beim manuellen Start gesetzt - ein Zeitplanlauf haelt sich
          # immer an das, was in SharePoint steht.
          CRM_ABDATUM:   ${{ github.event_name == 'workflow_dispatch' && inputs.stichtag || '' }}
          # Umlenken gilt nur fuer DIESEN Lauf. Ein Zeitplanlauf schreibt
          # immer dorthin, wo js/config.js hinzeigt - eine Umgebung, die vom
          # zuletzt gewaehlten Knopf abhaengt, waere nicht nachvollziehbar.
          CRM_DATAVERSE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung == 'TEST') && 'https://dihag-test.crm4.dynamics.com' || ((github.event_name == 'workflow_dispatch' && inputs.umgebung == 'PROD') && 'https://dihag-prod.crm4.dynamics.com' || '') }}
          CRM_UMGEBUNG:      ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung != 'wie in js/config.js') && inputs.umgebung || '' }}
        run: node automatik.mjs
